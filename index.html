<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body class="bg-light">
    <div class="container my-4">
        <div class="container bg-white border rounded-4 shadow p-5 mt-4">
            <section class ="hero-section container mt-5">
                <div class="dashboard-card">
                    <h5>Your Balance</h5>
                    <h1 id="dashboard-balance">₱0.00</h1>
                    <div class="summary">
                        <div class="income-box">
                            <h6>Income</h6>
                            <p id="income">₱0.00</p>
                        </div>

                        <div class="expense-box">
                            <h6>Expenses</h6>
                            <p id="expense">₱0.00</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="container mt-5">
                <div class="row g-4">
                    <div class="col-lg-6">
                        <div class="card shadow-sm h-100">
                            <div class="card-header"> Transactions </div>
                            <div class="card-body">
                                <ul id="transaction-list" class="list-group"></ul>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card shadow-sm h-100">
                            <div class="card-header"> Add Transaction </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label"> Description </label>
                                    <input type="text" id="description" class="form-control" placeholder="Enter description">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label"> Amount </label>
                                    <input type="number" id="amount" class="form-control" placeholder="Enter amount">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label"> Type </label>
                                    <select id="type" class="form-select">
                                        <option value="income">Income</option>
                                        <option value="expense">Expense</option>
                                    </select>
                                </div>

                                <button
                                    onclick="addTransaction()"
                                    class="add-button w-100">
                                    Add Transaction
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script src="crud.js"></script>
</body>
</html>
